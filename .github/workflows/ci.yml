name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake standard

  test:
    name: unit (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec

  integration:
    # M0 exit check: the fixture app dual-boots Rails 8.0 / 8.1 and both twins answer.
    name: integration shop 8.0→8.1 (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install fixture bundles (current and next Rails)
        working-directory: fixtures/apps/shop
        run: |
          bundle install --jobs 4
          BUNDLE_GEMFILE=Gemfile.next bundle install --jobs 4
      - name: Spike (M0 exit check)
        run: ruby bin/doubletrack-spike fixtures/apps/shop --path /orders
      - name: Integration specs (M0 spike + M1 recorder exit check)
        run: bundle exec rake spec:integration

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: gem build doubletrack.gemspec
