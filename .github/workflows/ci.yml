name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake standard

  test:
    name: unit (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec

  integration:
    # Milestone exit checks on the fixture apps, which dual-boot Rails 8.0 / 8.1.
    name: integration shop 8.0→8.1 (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install fixture bundles (current and next Rails)
        run: make fixtures
      - name: Spike (M0 exit check)
        run: ruby bin/doubletrack-spike fixtures/apps/shop --path /orders
      - name: Integration specs (M0–M5 exit checks)
        run: bundle exec rake spec:integration

  integration-postgresql:
    # M10 exit check (ADR 0037): shop on PostgreSQL 17. Each twin gets its own database,
    # restored from a template database before every session.
    name: integration shop on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: doubletrack
          POSTGRES_PASSWORD: doubletrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doubletrack"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BUNDLE_WITH: postgresql
      SHOP_DATABASE_URL: postgresql://doubletrack:doubletrack@localhost:5432/shop_test
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install fixture bundles (with shop's pg gem)
        run: make fixtures
      - name: PostgreSQL integration specs
        run: bundle exec rspec spec/integration/postgresql_spec.rb

  eval:
    # Precision/recall on fixtures/apps/planted (ADR 0020). Fails if any plant is missed,
    # any finding is unexpected, or the clean app has a finding.
    name: eval (planted fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install fixture bundles
        run: make fixtures
      - name: make eval
        run: make eval
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: eval/results/

  installed-gem:
    # Packaging (M8, ADR 0035): the built gem, installed into an empty directory and run from
    # outside the repository, replays shop and captures its tests. A file missing from
    # spec.files fails here.
    name: installed gem runs shop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install fixture bundles
        run: make fixtures
      - name: Build, install and run the gem
        run: REPO="$GITHUB_WORKSPACE" bash script/installed_gem_check

  action:
    # M9 exit check (ADR 0036): the GitHub Action, run on shop. Its outputs and summary must
    # match the run's results, and fail-on must fail the step on shop's one finding.
    name: action on shop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install fixture bundles
        run: make fixtures
      - name: Doubletrack (fail-on never)
        id: dt
        uses: ./
        with:
          app-path: fixtures/apps/shop
          capture: "false"
          seed: "42"
          fail-on: never
      - name: Outputs and summary match the results
        run: >-
          ruby script/check_action_outputs "${{ steps.dt.outputs.results-dir }}"
          "${{ steps.dt.outputs.verdict }}" "${{ steps.dt.outputs.findings }}" "${{ steps.dt.outputs.changes }}"
      - name: shop is not ready, with one change
        run: |
          test "${{ steps.dt.outputs.verdict }}" = not_ready
          test "${{ steps.dt.outputs.changes }}" = 1
          test "${{ steps.dt.outputs.exit-code }}" = 1
      - name: Doubletrack (fail-on user-visible)
        id: gate
        continue-on-error: true
        uses: ./
        with:
          app-path: fixtures/apps/shop
          capture: "true"
          install-bundles: "false"
          seed: "42"
          fail-on: user-visible
      - name: fail-on user-visible failed the step
        run: test "${{ steps.gate.outcome }}" = failure

  report-a11y:
    # The static report must pass axe (WCAG 2.1 AA rules) on every page.
    name: report accessibility (axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install fixture bundles
        run: make fixtures
      # Hand-written sessions plus captured ones with their HTTP stubs removed, so the
      # report has findings, repros, both snapshot kinds and a capture-fidelity mismatch table.
      - name: Generate a report (capture + doubletrack run on shop)
        run: |
          bundle exec exe/doubletrack capture fixtures/apps/shop --out tmp/a11y-capture/captured.jsonl
          mkdir -p tmp/a11y-sessions
          cp fixtures/apps/shop/doubletrack/sessions/smoke.jsonl tmp/a11y-sessions/
          ruby -rjson -ne 'puts($_.start_with?("{") ? JSON.generate(JSON.parse($_).tap { |s| s.delete("http_stubs") }) : $_)' \
            tmp/a11y-capture/captured.jsonl > tmp/a11y-sessions/captured.jsonl
          bundle exec exe/doubletrack run fixtures/apps/shop --sessions tmp/a11y-sessions --out tmp/a11y --seed 42 \
            --baseline tmp/a11y-baseline.yml || [ $? -eq 1 ]
          grep -q "Capture fidelity" tmp/a11y/*/report/coverage.html
      - name: axe (every page, one at a time)
        run: |
          report=$(ls -d tmp/a11y/*/report)
          count=0
          for page in $(find "$report" -name '*.html' | sort); do
            npx --yes @axe-core/cli@4 "file://$PWD/$page" --tags wcag2a,wcag2aa,wcag21a,wcag21aa --exit \
              --chromedriver-path "$CHROMEWEBDRIVER/chromedriver"
            count=$((count + 1))
          done
          echo "axe: $count pages checked, no violations"
          test "$count" -ge 5
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shop-report
          path: tmp/a11y/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: gem build doubletrack.gemspec
